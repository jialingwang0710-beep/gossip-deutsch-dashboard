  .vertical-label { overflow:hidden; color:var(--muted); font-size:11px; line-height:1.25; } .vertical-label b { display:block; color:var(--ink); font-size:14px; font-weight:500; } .vertical-label span { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    if (state.sort === 'performance') return (b.total||-1)-(a.total||-1) || b.date.localeCompare(a.date);
    if (state.sort === 'saves') return (b.saves||-1)-(a.saves||-1) || b.date.localeCompare(a.date);
    if (state.sort === 'title') return a.hook.localeCompare(b.hook,'zh-CN');
    return b.date.localeCompare(a.date);
  });
  return result;
}
function card(t) {
  const performance = t.total != null ? `<div class="performance"><b>${t.total}</b> 互动　赞 ${t.likes} · 藏 ${t.saves} · 评 ${t.comments}</div>` : `<div class="performance">${esc(t.raw_status)}</div>`;
  return `<article class="card" style="--category:${color(t.category)}" data-folder="${esc(t.folder)}">
    <div class="meta"><span class="badge">${esc(t.category)}</span><span>${esc(t.date)}</span></div>
    <div class="meta"><span class="status">${esc(t.status)}</span></div>
    <h2 class="hook">${esc(t.hook)}</h2>
    <div class="footer">${performance}</div>
  </article>`;
}
function render() {
  renderTabs(); const list = filtered();
  resultCount.innerHTML = `显示 <strong>${list.length}</strong> / ${DATA.topics.length} 条选题`;
  grid.innerHTML = list.length ? list.map(card).join('') : `<div class="empty">没有匹配的选题。试试换一个关键词或清空筛选。</div>`;
  grid.querySelectorAll('.card').forEach(el => el.addEventListener('click', event => { if (event.target.closest('a')) return; showDetail(el.dataset.folder); }));
}
function showDetail(folder) {
  const t = DATA.topics.find(item => item.folder === folder); if (!t) return;
  const captionControl = t.caption ? `<button type="button" class="caption-trigger" id="captionTrigger">查看正文文案</button><div id="captionView" class="caption-view" hidden><div class="caption-actions"><span>正文已保留原始换行，可直接复制发布。</span><button type="button" class="caption-copy" id="captionCopy">复制文案</button></div><pre class="caption-content">${esc(t.caption)}</pre></div>` : `<button type="button" class="caption-trigger" disabled>该期暂未找到正文文案</button>`;
  detailContent.innerHTML = `<span class="badge" style="--category:${color(t.category)};color:${color(t.category)}">${esc(t.category)}</span><h2 class="dialog-title">${esc(t.hook)}</h2>
  <div class="detail"><label>选题目录</label><p><code>${esc(t.folder)}</code></p></div>
  <div class="detail"><label>语法点</label><p>${esc(t.grammar)}</p></div>
  <div class="detail"><label>选题文案</label>${captionControl}</div>
  <div class="detail"><label>制作状态</label><p>${esc(t.raw_status)}</p></div>
  <div class="detail"><label>互动表现</label><p>${t.total != null ? `总互动 ${t.total} · 赞 ${t.likes} · 藏 ${t.saves} · 评论 ${t.comments}` : '尚未同步互动数据'}</p></div>
  <p style="margin:20px 0 0"><a class="open" href="${esc(t.href)}">打开对应文件夹 ↗</a></p>`;
  const trigger = detailContent.querySelector('#captionTrigger');
  if (trigger && t.caption) {
    trigger.addEventListener('click', () => { const view=detailContent.querySelector('#captionView'); view.hidden=!view.hidden; trigger.textContent=view.hidden ? '查看正文文案' : '收起正文文案'; });
    detailContent.querySelector('#captionCopy').addEventListener('click', async event => { const button=event.currentTarget; const original=button.textContent; const copied=await copyText(t.caption); button.textContent=copied ? '已复制 ✓' : '复制失败，请手动复制'; setTimeout(() => button.textContent=original, 1500); });
  }
  dialog.showModal();
}
async function copyText(value) {
  try { await navigator.clipboard.writeText(value); return true; } catch (_) {
    const area=document.createElement('textarea'); area.value=value; area.style.position='fixed'; area.style.opacity='0'; document.body.appendChild(area); area.select();
    const copied=document.execCommand('copy'); area.remove(); return copied;
  }
}
document.querySelector('#search').addEventListener('input', event => { state.query=event.target.value; render(); });
document.querySelector('#status').addEventListener('change', event => { state.status=event.target.value; render(); });
document.querySelector('#sort').addEventListener('change', event => { state.sort=event.target.value; render(); });
document.querySelector('#clear').addEventListener('click', () => { state.category='all'; state.status='all'; state.sort='date'; state.query=''; document.querySelector('#search').value=''; document.querySelector('#status').value='all'; document.querySelector('#sort').value='date'; render(); });
document.querySelector('#closeDialog').addEventListener('click', () => dialog.close());
dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); });
renderSummary();
renderVoiceDashboard();
render();
</script>
</body></html>
