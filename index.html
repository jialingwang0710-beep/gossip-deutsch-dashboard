<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>八卦德语 · 选题看板</title>
<style>
  :root { --ink:#2E403D; --muted:#7C8985; --outer-paper:#DCE8EA; --paper:#F8F5EE; --card:#FFFDF8; --line:#D6DDD6; --clay:#D6A08F; --blue:#8EAAB0; --moss:#93AA94; --sand:#F3F1EA; --shadow:rgba(73,101,100,.13); }
  * { box-sizing:border-box }
  html { background:var(--outer-paper); }
  body { margin:0; min-height:100vh; color:var(--ink); background:linear-gradient(135deg,#D6E4E7 0%,#EAF0EF 48%,#D7E3E6 100%); font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  button,input,select { font:inherit }
  .shell { max-width:1660px; margin:0 auto; padding:30px 34px 84px; }
  .masthead { display:flex; align-items:stretch; justify-content:space-between; gap:28px; padding:34px 38px 31px; color:var(--ink); background:rgba(255,253,248,.94); border:1px solid rgba(255,255,255,.85); border-left:7px solid var(--moss); border-radius:28px; box-shadow:0 18px 38px var(--shadow); }
  .masthead-avatar { flex:none; width:116px; height:116px; align-self:center; object-fit:cover; border:5px solid rgba(255,255,255,.78); border-radius:50%; background:#F5F1E8; box-shadow:0 9px 20px rgba(73,101,100,.16); }
  .eyebrow { margin:0 0 10px; font:700 11px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace; letter-spacing:.16em; color:#B98673; }
  h1 { margin:0; font-family:Georgia,"Songti SC","SimSun",serif; font-size:clamp(42px,5vw,74px); letter-spacing:-.06em; line-height:.94; }
  .subtitle { align-self:flex-end; max-width:390px; margin:0; color:var(--muted); font-size:13px; line-height:1.75; } .subtitle code { color:#B98673; }
  .stats { position:relative; z-index:1; display:grid; grid-template-columns:repeat(4,1fr); width:calc(100% - 76px); margin:-17px auto 34px; overflow:hidden; border:1px solid rgba(255,255,255,.85); border-radius:18px; box-shadow:0 12px 25px var(--shadow); }
  .stat { min-height:97px; padding:17px 19px; border-right:1px solid var(--line); background:rgba(255,253,248,.96); } .stat:last-child { border-right:0; }
  .stat b { display:block; font:700 36px/1 Georgia,serif; } .stat span { display:block; margin-top:5px; color:var(--muted); font-size:11px; letter-spacing:.06em; }
  .overview { display:grid; grid-template-columns:minmax(0,1.18fr) minmax(330px,.82fr); gap:20px; margin:0 0 36px; }
  .panel { padding:18px; border:1px solid rgba(255,255,255,.9); border-top:5px solid var(--moss); border-radius:20px; background:rgba(255,253,248,.96); box-shadow:0 12px 26px var(--shadow); }
  .panel:last-child { border-top-color:var(--clay); }
  .panel-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:0 2px 13px; margin-bottom:0; }
  .panel h2 { margin:0; font:700 23px/1.2 Georgia,"Songti SC",serif; } .panel-note { color:var(--muted); font-size:11px; }
  .visual-distribution { display:grid; grid-template-columns:minmax(270px,1.25fr) minmax(210px,.75fr); gap:22px; min-height:276px; padding:17px 15px 10px; border:1px solid #E3E6DF; border-radius:14px; background:var(--sand); }
  .vertical-chart { display:flex; align-items:flex-end; gap:8px; min-height:238px; padding:8px 5px 0; border-bottom:2px solid #AAB9B4; }
  .vertical-item { display:grid; grid-template-rows:22px 150px 40px; min-width:0; flex:1; text-align:center; } .vertical-value { align-self:end; color:var(--ink); font:700 13px ui-monospace,SFMono-Regular,Consolas,monospace; }
  .vertical-track { position:relative; display:flex; align-items:flex-end; height:150px; margin:0 auto; width:100%; max-width:31px; border-radius:12px 12px 0 0; background:#E4E8E1; } .vertical-fill { width:100%; height:var(--bar); border-radius:12px 12px 0 0; background:var(--category); box-shadow:inset 4px 0 rgba(255,255,255,.28); }
  .vertical-label { overflow:hidden; color:var(--muted); font-size:11px; line-height:1.25; } .vertical-label b { display:block; color:var(--ink); font-size:14px; font-weight:500; } .vertical-label span { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pie-wrap { display:flex; flex-direction:column; justify-content:center; align-items:center; border-left:1px solid var(--line); padding-left:20px; } .pie-wrap svg { width:155px; height:155px; overflow:visible; filter:drop-shadow(2px 4px 5px rgba(73,101,100,.12)); }
  .pie-center { font:700 23px Georgia,serif; fill:var(--ink); } .pie-caption { font-size:8px; letter-spacing:.16em; fill:var(--muted); } .pie-legend { display:grid; grid-template-columns:repeat(2,1fr); gap:6px 10px; width:100%; margin-top:13px; } .pie-legend span { overflow:hidden; color:var(--muted); font-size:10px; white-space:nowrap; text-overflow:ellipsis; } .pie-legend i { display:inline-block; width:8px; height:8px; margin-right:5px; border-radius:50%; background:var(--category); }
  .category-dot { display:inline-block; width:8px; height:8px; margin-right:7px; border-radius:50%; background:var(--category); }
  .unpublished { display:grid; gap:8px; }
  .unpublished-item { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 12px; border:1px solid var(--line); border-left:4px solid var(--clay); border-radius:11px; background:#FFFDF8; }
  .unpublished-item a { color:var(--ink); font-size:13px; font-weight:700; line-height:1.35; text-decoration:none; } .unpublished-item a:hover { text-decoration:underline; }
  .unpublished-item small { display:block; margin-top:2px; color:var(--muted); font:11px ui-monospace,SFMono-Regular,Consolas,monospace; }
  .unpublished-state { flex:none; padding:4px 7px; color:#845B4D; background:#F5E5DE; border:1px solid #E0B8AA; border-radius:999px; font-size:10px; font-weight:700; white-space:nowrap; }
  .voice-panel { margin:0 0 34px; padding:18px; border:1px solid rgba(255,255,255,.9); border-top:5px solid var(--blue); border-radius:20px; background:rgba(255,253,248,.96); box-shadow:0 12px 26px var(--shadow); }
  .voice-vertical-item { display:grid; grid-template-rows:22px 150px 40px; min-width:0; flex:1; padding:0; color:inherit; border:0; background:transparent; cursor:pointer; text-align:center; } .voice-vertical-item:hover .vertical-fill { filter:brightness(.9); } .voice-vertical-item.active .vertical-track { outline:2px solid var(--ink); outline-offset:3px; } .voice-vertical-item.active .vertical-label span { color:var(--ink); font-weight:700; }
  .voice-topic-area { display:grid; grid-template-columns:180px 1fr; gap:16px; min-height:75px; margin-top:14px; padding:13px; border:1px solid var(--line); border-radius:12px; background:#F7F5EE; } .voice-topic-title { color:var(--muted); font-size:12px; line-height:1.55; } .voice-topic-title b { display:block; margin-bottom:3px; color:var(--ink); font:700 20px/1.15 Georgia,"Songti SC",serif; } .voice-topic-list { display:flex; flex-wrap:wrap; align-content:flex-start; gap:7px; } .voice-topic-list a { padding:6px 8px; color:#55706A; border:1px solid #C4D3C8; border-radius:8px; background:#EDF3EF; text-decoration:none; font-size:11px; line-height:1.35; } .voice-topic-list a:hover { border-color:var(--blue); background:#E2ECE9; }
  section[aria-label="筛选选题"] { padding:20px; margin-bottom:16px; border:1px solid rgba(255,255,255,.9); border-radius:20px; background:rgba(255,253,248,.96); box-shadow:0 12px 26px var(--shadow); }
  .toolbar { display:grid; grid-template-columns:minmax(220px,1fr) 190px 160px 160px; gap:10px; margin:0 0 15px; }
  .field { width:100%; height:44px; border:1px solid #D6DED6; border-radius:11px; padding:0 12px; color:var(--ink); background:#F9F8F3; outline:none; }
  .field:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(142,170,176,.22); }
  .tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:0; }
  .tab { border:1px solid var(--line); background:transparent; padding:7px 12px; cursor:pointer; color:var(--muted); border-radius:999px; font-size:12px; }
  .tab:hover,.tab.active { border-color:#BFCFC8; color:var(--ink); background:#F2F6F2; }
  .tab.active { box-shadow:0 3px 8px rgba(117,148,139,.18); }
  .resultline { display:flex; justify-content:space-between; align-items:center; gap:16px; margin:0 0 15px; color:var(--muted); font-size:13px; }
  .resultline strong { color:var(--ink); }
  .grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
  .card { position:relative; display:flex; flex-direction:column; min-height:194px; padding:16px 16px 15px; border:1px solid rgba(255,255,255,.9); border-radius:17px; background:rgba(255,253,248,.98); overflow:hidden; box-shadow:0 8px 20px rgba(73,101,100,.09); transition:transform .18s ease,box-shadow .18s ease; }
  .card::before { content:""; position:absolute; top:0; left:0; height:6px; width:100%; background:var(--category); }
  .card::after { content:""; position:absolute; right:-20px; bottom:-22px; width:78px; height:78px; border-radius:50%; background:var(--category); opacity:.08; }
  .card:hover { transform:translateY(-4px); box-shadow:0 15px 30px rgba(73,101,100,.17); border-color:#C8D8D5; }
  .meta { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:5px; color:var(--muted); font:11px ui-monospace,SFMono-Regular,Consolas,monospace; }
  .badge { display:inline-block; max-width:70%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--category); font-weight:700; }
  .status { padding:3px 6px; border:1px solid var(--line); color:#5b5751; }
  .hook { position:relative; z-index:1; margin:18px 0 10px; font:700 18px/1.42 "PingFang SC","Microsoft YaHei",sans-serif; letter-spacing:-.03em; }
  .footer { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-top:auto; padding-top:12px; }
  .performance { position:relative; z-index:1; font-size:11px; color:var(--muted); } .performance b { color:var(--ink); font:700 19px Georgia,serif; }
  .open { position:relative; z-index:1; color:var(--blue); text-decoration:none; font-size:12px; font-weight:700; } .open:hover { text-decoration:underline; }
  .empty { grid-column:1/-1; padding:46px 15px; color:var(--muted); text-align:center; border:1px dashed var(--line); }
  dialog { width:min(720px,calc(100vw - 32px)); border:1px solid rgba(255,255,255,.95); border-top:6px solid var(--clay); border-radius:20px; padding:0; background:var(--card); color:var(--ink); box-shadow:0 22px 48px rgba(31,48,47,.25); }
  dialog::backdrop { background:rgba(69,92,94,.32); } .dialog-body { padding:28px; }
  .dialog-close { float:right; border:0; background:transparent; cursor:pointer; font-size:22px; } .dialog-title { margin:18px 0; font:700 29px/1.3 "PingFang SC",sans-serif; }
  .detail { padding:16px 0; border-top:1px solid var(--line); } .detail label { display:block; margin-bottom:7px; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.1em; } .detail p { margin:0; line-height:1.7; }
  .caption-trigger,.caption-copy { padding:8px 10px; color:#55706A; border:1px solid #C4D3C8; border-radius:9px; background:#EDF3EF; cursor:pointer; font:700 12px "PingFang SC","Microsoft YaHei",sans-serif; } .caption-trigger:hover,.caption-copy:hover { background:#E2ECE9; border-color:var(--blue); } .caption-trigger:disabled { color:var(--muted); border-color:var(--line); background:#F4F1EA; cursor:not-allowed; }
  .caption-view { margin-top:11px; padding:12px; border:1px solid #D8DED5; border-radius:12px; background:#FAF9F4; } .caption-actions { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px; } .caption-actions span { color:var(--muted); font-size:11px; } .caption-content { max-height:420px; margin:0; overflow:auto; color:#394945; font:13px/1.75 "PingFang SC","Microsoft YaHei",sans-serif; white-space:pre-wrap; word-break:break-word; }
  @media (max-width:1240px) { .grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
  @media (max-width:1040px) { .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .toolbar { grid-template-columns:1fr 1fr; } .overview { grid-template-columns:1fr; } }
  @media (max-width:680px) { .shell { padding:16px 14px 50px; } .masthead { align-items:flex-start; flex-direction:column; padding:25px 22px; } .masthead-avatar { width:86px; height:86px; align-self:flex-start; } .stats { grid-template-columns:repeat(2,1fr); width:100%; margin:0 0 24px; } .grid { grid-template-columns:1fr; } .toolbar { grid-template-columns:1fr; } .subtitle { max-width:none; } .visual-distribution { grid-template-columns:1fr; } .pie-wrap { border-left:0; border-top:1px solid var(--line); padding:16px 0 0; } .voice-topic-area { grid-template-columns:1fr; } }
</style>

  const circumference=289.03; let offset=0;
  const circles=groups.map(group => { const shade=(VOICE_META[group.voice]||['','#8a8277'])[1]; const dash=group.topics.length/total*circumference; const circle=`<circle cx="73" cy="73" r="46" fill="none" stroke="${shade}" stroke-width="19" stroke-dasharray="${dash} ${circumference-dash}" stroke-dashoffset="-${offset}" transform="rotate(-90 73 73)"/>`; offset+=dash; return circle; }).join('');
  document.querySelector('#voicePie').innerHTML=`<svg viewBox="0 0 146 146" role="img" aria-label="语音占比圆饼图"><circle cx="73" cy="73" r="46" fill="none" stroke="#ebe5da" stroke-width="19"/>${circles}<text x="73" y="69" text-anchor="middle" class="pie-center">${total}</text><text x="73" y="84" text-anchor="middle" class="pie-caption">VOICES</text></svg><div class="pie-legend">${groups.map(g => {const shade=(VOICE_META[g.voice]||['','#8a8277'])[1];return `<span><i style="--category:${shade}"></i>${esc(g.voice)} ${Math.round(g.topics.length/total*100)}%</span>`}).join('')}</div>`;
  function showVoiceTopics() {
    const area=document.querySelector('#voiceTopicArea'); const group=groups.find(g=>g.voice===activeVoice);
    if(!group) { area.hidden=true; area.innerHTML=''; return; }
    const [kind]=VOICE_META[group.voice]||['未知']; const links=group.topics.sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<a href="${esc(t.href)}">${esc(t.hook)}</a>`).join('');
    area.hidden=false;
    area.innerHTML=`<div class="voice-topic-title"><b>${esc(group.voice)}</b>${kind} · 共 ${group.topics.length} 条 · 占正片总数 ${Math.round(group.topics.length/total*100)}%</div><div class="voice-topic-list">${links}</div>`;
  }
  document.querySelectorAll('.voice-vertical-item').forEach(button=>button.addEventListener('click',()=>{ activeVoice=button.dataset.voice; renderVoiceDashboard(); }));
  showVoiceTopics();
}
function renderTabs() {
  const counts = Object.fromEntries(DATA.categories.map(c => [c.name, DATA.topics.filter(t => t.category === c.name).length]));
  tabs.innerHTML = `<button class="tab ${state.category==='all'?'active':''}" data-cat="all">全部 <b>${DATA.topics.length}</b></button>` + DATA.categories.map(c => `<button class="tab ${state.category===c.name?'active':''}" data-cat="${esc(c.name)}">${esc(icon(c.name))} ${esc(c.name.replace(/^\S+\s*/,''))} <b>${counts[c.name]||0}</b></button>`).join('');
  tabs.querySelectorAll('button').forEach(button => button.addEventListener('click', () => { state.category=button.dataset.cat; render(); }));
}
function filtered() {
  const q = state.query.trim().toLowerCase();
  const result = DATA.topics.filter(t => (state.category === 'all' || t.category === state.category) && (state.status === 'all' || t.status === state.status) && (!q || [t.folder,t.slug,t.hook,t.grammar,t.category,t.raw_status].join(' ').toLowerCase().includes(q)));
  result.sort((a,b) => {
    if (state.sort === 'performance') return (b.total||-1)-(a.total||-1) || b.date.localeCompare(a.date);
    if (state.sort === 'saves') return (b.saves||-1)-(a.saves||-1) || b.date.localeCompare(a.date);
    if (state.sort === 'title') return a.hook.localeCompare(b.hook,'zh-CN');
    return b.date.localeCompare(a.date);
  });
  return result;
}
function card(t) {
  const performance = t.total != null ? `<div class="performance"><b>${t.total}</b> 互动　赞 ${t.likes} · 藏 ${t.saves} · 评 ${t.comments}</div>` : `<div class="performance">${esc(t.raw_status)}</div>`;
  return `<article class="card" style="--category:${color(t.category)}" data-folder="${esc(t.folder)}">
    <div class="meta"><span class="badge">${esc(t.category)}</span><span>${esc(t.date)}</span></div>
    <div class="meta"><span class="status">${esc(t.status)}</span></div>
    <h2 class="hook">${esc(t.hook)}</h2>
    <div class="footer">${performance}</div>
  </article>`;
}
function render() {
  renderTabs(); const list = filtered();
  resultCount.innerHTML = `显示 <strong>${list.length}</strong> / ${DATA.topics.length} 条选题`;
  grid.innerHTML = list.length ? list.map(card).join('') : `<div class="empty">没有匹配的选题。试试换一个关键词或清空筛选。</div>`;
  grid.querySelectorAll('.card').forEach(el => el.addEventListener('click', event => { if (event.target.closest('a')) return; showDetail(el.dataset.folder); }));
}
function showDetail(folder) {
  const t = DATA.topics.find(item => item.folder === folder); if (!t) return;
  const captionControl = t.caption ? `<button type="button" class="caption-trigger" id="captionTrigger">查看正文文案</button><div id="captionView" class="caption-view" hidden><div class="caption-actions"><span>正文已保留原始换行，可直接复制发布。</span><button type="button" class="caption-copy" id="captionCopy">复制文案</button></div><pre class="caption-content">${esc(t.caption)}</pre></div>` : `<button type="button" class="caption-trigger" disabled>该期暂未找到正文文案</button>`;
  detailContent.innerHTML = `<span class="badge" style="--category:${color(t.category)};color:${color(t.category)}">${esc(t.category)}</span><h2 class="dialog-title">${esc(t.hook)}</h2>
  <div class="detail"><label>选题目录</label><p><code>${esc(t.folder)}</code></p></div>
  <div class="detail"><label>语法点</label><p>${esc(t.grammar)}</p></div>
  <div class="detail"><label>选题文案</label>${captionControl}</div>
  <div class="detail"><label>制作状态</label><p>${esc(t.raw_status)}</p></div>
  <div class="detail"><label>互动表现</label><p>${t.total != null ? `总互动 ${t.total} · 赞 ${t.likes} · 藏 ${t.saves} · 评论 ${t.comments}` : '尚未同步互动数据'}</p></div>
  <p style="margin:20px 0 0"><a class="open" href="${esc(t.href)}">打开对应文件夹 ↗</a></p>`;
  const trigger = detailContent.querySelector('#captionTrigger');
  if (trigger && t.caption) {
    trigger.addEventListener('click', () => { const view=detailContent.querySelector('#captionView'); view.hidden=!view.hidden; trigger.textContent=view.hidden ? '查看正文文案' : '收起正文文案'; });
    detailContent.querySelector('#captionCopy').addEventListener('click', async event => { const button=event.currentTarget; const original=button.textContent; const copied=await copyText(t.caption); button.textContent=copied ? '已复制 ✓' : '复制失败，请手动复制'; setTimeout(() => button.textContent=original, 1500); });
  }
  dialog.showModal();
}
async function copyText(value) {
  try { await navigator.clipboard.writeText(value); return true; } catch (_) {
    const area=document.createElement('textarea'); area.value=value; area.style.position='fixed'; area.style.opacity='0'; document.body.appendChild(area); area.select();
    const copied=document.execCommand('copy'); area.remove(); return copied;
  }
}
document.querySelector('#search').addEventListener('input', event => { state.query=event.target.value; render(); });
document.querySelector('#status').addEventListener('change', event => { state.status=event.target.value; render(); });
document.querySelector('#sort').addEventListener('change', event => { state.sort=event.target.value; render(); });
document.querySelector('#clear').addEventListener('click', () => { state.category='all'; state.status='all'; state.sort='date'; state.query=''; document.querySelector('#search').value=''; document.querySelector('#status').value='all'; document.querySelector('#sort').value='date'; render(); });
document.querySelector('#closeDialog').addEventListener('click', () => dialog.close());
dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); });
renderSummary();
renderVoiceDashboard();
render();
</script>
</body></html>
